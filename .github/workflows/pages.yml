name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install web dependencies
        working-directory: web
        run: npm ci
      - name: Check and build content
        shell: bash
        run: |
          if [ -f scripts/content-check.mjs ]; then node scripts/content-check.mjs; fi
          if [ -f scripts/build-content.mjs ]; then node scripts/build-content.mjs; fi
      - name: Typecheck web
        working-directory: web
        run: npm run typecheck
      - name: Build web
        working-directory: web
        run: npm run build
      - name: Add installers and Pages fallback
        shell: bash
        run: |
          cp install/install.sh install/install.ps1 install/uninstall.sh web/dist/
          if [ ! -f web/dist/404.html ]; then cp web/dist/index.html web/dist/404.html; fi
          touch web/dist/.nojekyll
      - name: Make web tarball
        run: tar -czf jargle-web.tar.gz -C web/dist .
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist
      - name: Upload web tarball
        uses: actions/upload-artifact@v4
        with:
          name: web-tarball
          path: jargle-web.tar.gz

  deploy:
    needs: build
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Keep builds working when Pages is unavailable or disabled.
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  web-latest:
    needs: build
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download web tarball
        uses: actions/download-artifact@v4
        with:
          name: web-tarball
      - name: Publish rolling web release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          if ! gh release view web-latest >/dev/null 2>&1; then
            gh release create web-latest jargle-web.tar.gz \
              --prerelease --latest=false --title "Web build (rolling)" \
              --notes "Server web build for commit $GITHUB_SHA." \
              --target "$GITHUB_SHA"
          else
            # Move the rolling tag in place so the server never sees a 404 gap.
            gh api -X PATCH "repos/$GH_REPO/git/refs/tags/web-latest" -f sha="$GITHUB_SHA" -F force=true
            gh release edit web-latest --prerelease --latest=false --notes "Server web build for commit $GITHUB_SHA."
            gh release upload web-latest jargle-web.tar.gz --clobber
          fi
